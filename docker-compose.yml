services:
  jobpilot:
    build:
      context: ./jobpilot
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./jobpilot/resumes:/app/resumes
      - ./jobpilot/logs:/app/logs
      - ./jobpilot/generated:/app/generated
      - ./jobpilot/users.db:/app/users.db
    restart: unless-stopped
