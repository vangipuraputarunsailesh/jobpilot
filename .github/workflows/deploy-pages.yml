name: Deploy to GitHub Pages

# Builds the static site (scripts/build_pages.py) and deploys it to
# GitHub Pages. This is the only deploy surface — there is no separate
# backend. The companion Cloudflare Worker (proxy/) is deployed
# independently via `wrangler deploy`, not by this workflow.

on:
  push:
    branches: [master, main]
    paths:
      - "jobpilot/templates/**"
      - "jobpilot/static/**"
      - "scripts/build_pages.py"
      - "scripts/test-ai.cjs"
      - "scripts/test_build_pages.py"
      - "scripts/test-jobs.cjs"
      - "scripts/test-companion.cjs"
      - "scripts/test-drive.cjs"
      - "companion/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment per branch. In-progress runs are NOT
# cancelled so the live site is never half-deployed.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test providers, search and browser companion
        run: node --test scripts/test-ai.cjs scripts/test-jobs.cjs scripts/test-companion.cjs scripts/test-drive.cjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Test static asset versioning
        run: python -m unittest discover -s scripts -p test_build_pages.py

      - name: Build docs/ from templates
        env:
          # If a repo secret named GOOGLE_CLIENT_ID is defined, it is
          # substituted into the GSI button. Otherwise the button stays
          # hidden and only "Try Demo" is reachable on the landing page.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: python scripts/build_pages.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
